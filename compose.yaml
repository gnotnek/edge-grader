# edge-grader on the lab's DGX Spark. Usage: docs/guides/spark-docker.md
# The GPU comes in through CDI (the Spark's Docker has no "nvidia" runtime).
# Everything a run reads or writes stays in this folder: models in data/models, the Hugging Face
# cache (and token) in data/hf, adapters in data/adapters, logs in data/logs, summaries in results/.

x-common: &common
  image: edge-grader:spark
  build:
    context: .
    dockerfile: docker/Dockerfile
  devices:
    - nvidia.com/gpu=all
  volumes:
    - .:/workspace
    - ./data/models:/models
  shm_size: 16g

# One fine-tuning run per container, named so lab members can find it in `docker ps`.
x-finetune: &finetune
  <<: *common
  profiles: [finetune]  # never started by a plain `docker compose up`
  restart: "no"

services:
  # Shell, tests: docker compose run --rm dev <command>
  dev:
    <<: *common

  # Grading server with the lab's baseline flags, on 127.0.0.1 only.
  llama-server:
    <<: *common
    container_name: edge-grader-llama-server
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8099}:8080"
    command: >
      llama-server -m /models/${MODEL:-gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf}
      -c 8192 --host 0.0.0.0 --port 8080
      -rea off --reasoning-budget -1 --cache-ram 0 -ngl 99

  # Stage 3b, E4B (moved from Kaggle, 2026-11-05): docker compose up -d finetune-e4b-lf
  finetune-e4b-lf:
    <<: *finetune
    container_name: edge-grader-finetune-e4b-lf
    command: scripts/spark_finetune.sh e4b label-first

  finetune-e4b-rf:
    <<: *finetune
    container_name: edge-grader-finetune-e4b-rf
    command: scripts/spark_finetune.sh e4b reason-first

  # Trained on Beetle and SAF only, so all of SciEntsBank stays unseen.
  finetune-e2b-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e2b-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e2b label

  finetune-e4b-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e4b-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e4b label

  # Qwen3-14B writes the reasons the Beetle + SAF label-first and reason-first adapters train on.
  reasons-beetle-saf:
    <<: *finetune
    container_name: edge-grader-reasons-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_reasons.sh

  finetune-e2b-lf-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e2b-lf-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e2b label-first

  finetune-e2b-rf-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e2b-rf-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e2b reason-first

  finetune-e4b-lf-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e4b-lf-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e4b label-first

  finetune-e4b-rf-beetle-saf:
    <<: *finetune
    container_name: edge-grader-finetune-e4b-rf-beetle-saf
    environment:
      TRAIN_SETS: "beetle saf"
    command: scripts/spark_finetune.sh e4b reason-first

  # SciEntsBank, all three test splits, on every version: docs/guides/spark-docker.md
  bench-scientsbank:
    <<: *finetune
    container_name: edge-grader-bench-scientsbank
    command: scripts/spark_bench_scientsbank.sh

  # The same with E2B and E4B untouched, queued last.
  bench-scientsbank-baseline:
    <<: *finetune
    container_name: edge-grader-bench-scientsbank-baseline
    environment:
      BASELINE: "1"
    command: scripts/spark_bench_scientsbank.sh

  # Graded examples in the prompt (spec 2026-11-10): E4B untouched, + examples, adapter + examples,
  # + random examples, all three splits.
  bench-scientsbank-examples:
    <<: *finetune
    container_name: edge-grader-bench-scientsbank-examples
    environment:
      EXAMPLES: "1"
    command: scripts/spark_bench_scientsbank.sh

  # Stage 5, ASAP 2.0: the untouched models, then the adapters, one at a time.
  bench-asap2:
    <<: *finetune
    container_name: edge-grader-bench-asap2
    command: scripts/spark_bench_asap2.sh

  # ASAP 2.0 with thinking on: E2B and E4B untouched.
  bench-asap2-think:
    <<: *finetune
    container_name: edge-grader-bench-asap2-think
    environment:
      THINKING: "1"
    command: scripts/spark_bench_asap2.sh
