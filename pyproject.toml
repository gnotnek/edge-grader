[project]
name = "edge-grader"
version = "0.1.0"
description = "Small LLMs grading student short answers on edge devices: baseline, RAG, fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "httpx>=0.28.1",
    "openai>=1.40",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
edge-grader-baseline = "edge_grader.baseline:main"
edge-grader-cost = "edge_grader.cost:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
embed = [
    "sentence-transformers>=6.1.0",
]
rag = [
    "numpy>=2.4.6",
    "pymupdf>=1.28.2",
]
# rag:   extract and chunk the material (runs on this Mac)
# embed: the embedding model, with torch; build indexes on Kaggle (this Mac doesn't run models)
# finetune (stage 3): runs on Kaggle/Colab with Unsloth, not on this machine

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_grader"]

[tool.ruff]
line-length = 100
